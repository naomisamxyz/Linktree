<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Integrated Media Linktree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0a0a0a;
    --paper:#ffffff;
    --paper-dim:#f3f3f1;
    --ink:#111110;
    --ink-soft:#111110;
    --hair:#111110;
    --hair-on-dark:rgba(239,238,230,0.4);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:transparent;
    color:var(--ink);
    font-family:"Source Code Pro",ui-monospace,"SFMono-Regular",Menlo,monospace;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:760px;
    min-height:100vh;
    min-height:100dvh;
    margin:0 auto;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
  }

  /* ---------- FULL-PAGE BACKGROUND ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:#000;
  }

  .bg__img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:52% 40%;
    filter:grayscale(1) contrast(1.08);
    opacity:0.9;
  }

  .bg__scrim{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.35) 32%, rgba(0,0,0,0.72) 62%, rgba(10,10,10,0.9) 100%);
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    flex:0 0 auto;
    min-height:16px;
    display:flex;
    align-items:flex-end;
  }

  .hero__content{
    position:relative;
    z-index:2;
    width:100%;
    padding:0 clamp(16px,5vw,40px) 28px;
  }

  .hero__eyebrow{
    font-size:0.68rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--paper);
    opacity:0.75;
    margin:0 0 10px;
  }

  .hero__title{
    font-family:"Source Code Pro",ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-weight:800;
    text-transform:uppercase;
    color:var(--paper);
    font-size:clamp(2.2rem,9vw,4.2rem);
    line-height:0.98;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }

  .hero__title span{
    display:block;
  }

  .hero__sub{
    margin:14px 0 0;
    font-size:0.8rem;
    color:var(--paper);
    opacity:0.65;
    letter-spacing:0.04em;
  }

  /* ---------- LINK GRID ---------- */
  .board{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:0;
    padding:2px clamp(14px,4vw,28px) 12px;
  }

  .board__label{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--paper);
    opacity:0.55;
    font-size:0.68rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    margin:26px 0 14px;
  }

  .board__label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--hair-on-dark);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
  }

  .grid + .grid{
    margin-top:-28px;
  }

  .cell{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    min-width:0;
    background:transparent;
    border-style:solid;
    border-color:transparent;
    border-width:36px 14px 40px 14px;
    border-image-source:url('bubble.png');
    border-image-slice:60 47 62 46 fill;
    border-image-repeat:stretch;
    border-radius:0;
    padding:4px 16px 14px 16px;
    text-decoration:none;
    color:var(--ink);
    font-family:"Source Code Pro",ui-monospace,"SFMono-Regular",Menlo,monospace;
    transition:filter 0.12s ease;
  }

  .cell:hover,
  .cell:focus-visible{
    outline:none;
    filter:brightness(0.97);
  }

  .cell:active{
    filter:brightness(0.93);
  }

  .cell__text{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
  }

  .cell__title{
    font-weight:700;
    font-size:1.15rem;
    text-transform:uppercase;
    letter-spacing:0.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .cell__meta{
    font-size:0.92rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* two-up row for the smaller pair */
  .grid--pair{
    display:flex;
    gap:0;
  }

  .grid--pair .cell{
    flex:1 1 0;
    min-width:0;
  }

  /* ---------- FOOTER ---------- */
  .foot{
    padding:22px clamp(14px,4vw,28px) 40px;
    border-top:1px solid var(--hair-on-dark);
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    color:var(--paper);
  }

  .foot__name{
    font-size:0.74rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.8;
  }

  .foot__meta{
    font-size:0.7rem;
    opacity:0.45;
    letter-spacing:0.03em;
  }

  @media (prefers-reduced-motion: reduce){
    .cell{ transition:none; }
  }

  @media (max-width:480px){
    .board, .doc{
      padding-left:6px;
      padding-right:6px;
    }
    .cell, .panel{
      border-left-width:14px;
      border-right-width:14px;
    }
  }
</style>
</head>
<body>

<div class="bg">
  <img class="bg__img" src="bg.jpg" alt="">
  <div class="bg__scrim"></div>
</div>

<div class="page">
  <header class="hero"></header>

  <main class="board">
    <div class="grid">
      <a class="cell" href="schedule.html">
        <span class="cell__text">
          <span class="cell__title">Schedule Fall 26</span>
          <span class="cell__meta">classes &amp; office hours</span>
        </span>
      </a>
    </div>

    <div class="grid">
      <a class="cell" href="room-policy.html">
        <span class="cell__text">
          <span class="cell__title">C108 Room Policy &amp; Reservation</span>
          <span class="cell__meta">booking policies &amp; request form</span>
        </span>
      </a>
    </div>

    <div class="grid">
      <a class="cell" href="equipment-checkout.html">
        <span class="cell__text">
          <span class="cell__title">Equipment Checkout</span>
          <span class="cell__meta">equipment list &amp; checkout form</span>
        </span>
      </a>
    </div>

    <div class="grid">
      <a class="cell" href="requirements.html">
        <span class="cell__text">
          <span class="cell__title">IM Requirements</span>
          <span class="cell__meta">graduation requirements</span>
        </span>
      </a>
    </div>

    <div class="grid">
      <a class="cell" href="mailto:im@calarts.edu">
        <span class="cell__text">
          <span class="cell__title">Contact</span>
          <span class="cell__meta">im@calarts.edu</span>
        </span>
      </a>
    </div>

    <div class="grid grid--pair">
      <a class="cell" href="https://www.instagram.com/centerforintegratedmedia/" target="_blank" rel="noopener">
        <span class="cell__text">
          <span class="cell__title">Instagram</span>
          <span class="cell__meta">@centerforintegratedmedia</span>
        </span>
      </a>
      <a class="cell" href="https://centerforintegratedmedia.org/" target="_blank" rel="noopener">
        <span class="cell__text">
          <span class="cell__title">Website</span>
          <span class="cell__meta">centerforintegratedmedia.org</span>
        </span>
      </a>
    </div>
  </main>
</div>

</body>
</html>
